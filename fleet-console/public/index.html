<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentinelC Fleet Console</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2230;
    --border: #2b313b;
    --fg: #e6edf3;
    --muted: #8b949e;
    --crit: #f85149;
    --high: #fb8500;
    --med: #d29922;
    --low: #58a6ff;
    --info: #6e7681;
    --accent: #2f81f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #11161d, #0d1117);
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header .brand-sub { color: var(--muted); font-size: 12px; }
  .summary { margin-left: auto; display: flex; gap: 22px; }
  .stat { text-align: right; }
  .stat .num { font-size: 22px; font-weight: 600; }
  .stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat.alert .num { color: var(--crit); }

  main { display: flex; gap: 0; height: calc(100vh - 70px); }
  .fleet { flex: 1 1 60%; overflow: auto; padding: 16px 24px; }
  .detail {
    flex: 1 1 40%;
    max-width: 560px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow: auto;
    padding: 16px 20px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); cursor: pointer; user-select: none; position: sticky; top: 0;
    background: var(--bg);
  }
  th:hover { color: var(--fg); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr.selected { background: #1f6feb22; outline: 1px solid var(--accent); }
  .host { font-weight: 600; }
  .seen { color: var(--muted); font-size: 12px; }

  .badge {
    display: inline-block; min-width: 26px; text-align: center;
    padding: 2px 7px; border-radius: 5px; font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .badge.zero { opacity: .28; background: #21262d; color: var(--muted); }
  .b-crit { background: #f8514922; color: var(--crit); border: 1px solid #f8514955; }
  .b-high { background: #fb850022; color: var(--high); border: 1px solid #fb850055; }
  .b-med  { background: #d2992222; color: var(--med);  border: 1px solid #d2992255; }
  .b-low  { background: #58a6ff22; color: var(--low);  border: 1px solid #58a6ff55; }
  .total { font-weight: 700; font-variant-numeric: tabular-nums; }

  .detail h2 { margin: 0 0 2px; font-size: 16px; }
  .detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .detail .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .finding {
    border: 1px solid var(--border); border-left-width: 3px;
    border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel2);
  }
  .finding.sev-critical { border-left-color: var(--crit); }
  .finding.sev-high { border-left-color: var(--high); }
  .finding.sev-medium { border-left-color: var(--med); }
  .finding.sev-low { border-left-color: var(--low); }
  .finding.sev-info { border-left-color: var(--info); }
  .finding .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .finding .rule { font-weight: 600; }
  .finding .sevtag {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; text-transform: uppercase;
    letter-spacing: .5px; font-weight: 700;
  }
  .sevtag.sev-critical { background: var(--crit); color: #fff; }
  .sevtag.sev-high { background: var(--high); color: #1a1a1a; }
  .sevtag.sev-medium { background: var(--med); color: #1a1a1a; }
  .sevtag.sev-low { background: var(--low); color: #06121f; }
  .sevtag.sev-info { background: var(--info); color: #fff; }
  .finding .title { color: var(--fg); margin-bottom: 4px; }
  .finding .target { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .finding .evidence {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px; background: #0b0f15; border: 1px solid var(--border);
    border-radius: 4px; padding: 7px 9px; white-space: pre-wrap; word-break: break-word;
    color: #c9d1d9; max-height: 160px; overflow: auto;
  }
  .refresh { color: var(--muted); font-size: 11px; margin-top: 10px; }

  /* drill-down */
  .finding .row1 { cursor: pointer; }
  .finding .chev {
    margin-left: auto; color: var(--muted); font-size: 11px;
    transition: transform .15s ease; user-select: none;
  }
  .finding.open .chev { transform: rotate(90deg); }
  .fdetail { display: none; margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .finding.open .fdetail { display: block; }
  .fgrid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; margin-bottom: 8px; }
  .fgrid dt { color: var(--muted); white-space: nowrap; }
  .fgrid dd { margin: 0; word-break: break-word; }
  .confbar { display: inline-block; vertical-align: middle; width: 90px; height: 7px;
    background: #0b0f15; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-right: 7px; }
  .confbar > i { display: block; height: 100%; background: var(--accent); }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px;
    background: #21262d; border: 1px solid var(--border); color: var(--fg);
  }
  .pill.act-kill, .pill.act-quarantine { background: #f8514922; color: var(--crit); border-color: #f8514955; }
  .pill.act-suspend, .pill.act-disable_svc { background: #fb850022; color: var(--high); border-color: #fb850055; }
  .pill.act-review { background: #58a6ff22; color: var(--low); border-color: #58a6ff55; }
  .fexplain { font-size: 12px; line-height: 1.5; }
  .fexplain .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-size: 10px; display: block; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>SentinelC &middot; Fleet Console</h1>
    <div class="brand-sub">Windows threat-triage &mdash; fleet management view</div>
  </div>
  <div class="summary">
    <div class="stat"><div class="num" id="s-hosts">0</div><div class="lbl">Hosts</div></div>
    <div class="stat alert"><div class="num" id="s-crithosts">0</div><div class="lbl">With criticals</div></div>
    <div class="stat"><div class="num" id="s-crit">0</div><div class="lbl">Total criticals</div></div>
  </div>
</header>

<main>
  <section class="fleet">
    <table id="fleet-table">
      <thead>
        <tr>
          <th data-sort="hostname">Host</th>
          <th data-sort="lastSeen">Last seen</th>
          <th data-sort="critical">CRIT</th>
          <th data-sort="high">HIGH</th>
          <th data-sort="medium">MED</th>
          <th data-sort="low">LOW</th>
          <th data-sort="total">Total</th>
        </tr>
      </thead>
      <tbody id="fleet-body"></tbody>
    </table>
    <div class="refresh" id="refresh-note"></div>
  </section>

  <aside class="detail" id="detail">
    <div class="empty">Select a host to view its findings.</div>
  </aside>
</main>

<script>
  var hosts = [];
  var selected = null;
  var sortKey = 'critical';
  var sortDir = -1;
  var tokenKey = 'sentinelcFleetConsoleToken';
  var apiToken = window.localStorage.getItem(tokenKey) || '';

  function ensureToken() {
    while (!apiToken) {
      var v = window.prompt('Fleet console token');
      if (v === null) throw new Error('token required');
      apiToken = String(v).trim();
      if (apiToken) window.localStorage.setItem(tokenKey, apiToken);
    }
  }

  function apiFetch(path) {
    ensureToken();
    return fetch(path, {
      cache: 'no-store',
      headers: { Authorization: 'Bearer ' + apiToken }
    }).then(function (r) {
      if (r.status === 401) {
        window.localStorage.removeItem(tokenKey);
        apiToken = '';
        throw new Error('unauthorized');
      }
      return r;
    });
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString();
  }

  // Plain-English meaning by rule family (prefix before the dot in the rule id).
  var RULE_FAMILY = {
    PROC: 'Suspicious process attributes or behavior (unsigned, masquerading, odd location, or runtime memory flags).',
    SVC: 'A Windows service with suspicious characteristics (unsigned binary, odd path, or hidden config).',
    PERSIST: 'An auto-start / persistence mechanism that survives reboot (Run key, service, scheduled task, LSA/startup).',
    NET: 'Suspicious network activity — possible command-and-control beacon, reverse shell, or IOC-matched endpoint.',
    KEY: 'Possible keylogging — the process installs keyboard hooks or polls key state, often alongside network access.',
    RK: 'User-mode rootkit hiding — a cross-view discrepancy where an artifact is visible to one API but hidden from another.',
    CORR: 'A correlated implant — multiple independent detections landed on the same process/file, raising confidence.',
    CRED: 'Credential-theft risk — a process is touching LSASS memory or sensitive credential files.',
    MEM: 'Injected or unbacked code in memory — a reflective PE, hollowed process, or RWX shellcode region not backed by a file on disk.',
    EVADE: 'Defense evasion — in-memory tampering of AMSI or ETW to blind security tooling.',
    FILE: 'Malicious file content — a YARA rule or IOC string matched the scanned file.',
    FIM: 'File-integrity / baseline change — a watched executable changed, or the baseline itself was tampered with.'
  };
  var ACTION_INFO = {
    REVIEW: 'Investigate manually. The scanner did not auto-recommend a destructive action.',
    KILL: 'Recommend terminating the offending process.',
    SUSPEND: 'Recommend suspending the process so it can be captured for forensics before it is killed.',
    DISABLE_SVC: 'Recommend disabling the service so it does not restart.',
    QUARANTINE: 'Recommend quarantining the file (move + lock down) so it cannot execute.'
  };
  function ruleFamily(rule) {
    var fam = String(rule || '').split('.')[0].toUpperCase();
    return RULE_FAMILY[fam] || 'Triage finding. See the evidence line for specifics.';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function badge(n, cls) {
    var zero = (n || 0) === 0;
    return '<span class="badge ' + (zero ? 'zero' : cls) + '">' + (n || 0) + '</span>';
  }

  function sortHosts() {
    hosts.sort(function (a, b) {
      var av, bv;
      if (sortKey === 'hostname') { av = a.hostname.toLowerCase(); bv = b.hostname.toLowerCase(); }
      else if (sortKey === 'lastSeen') { av = a.lastSeen || ''; bv = b.lastSeen || ''; }
      else if (sortKey === 'total') { av = a.counts.total; bv = b.counts.total; }
      else { av = a.counts[sortKey]; bv = b.counts[sortKey]; }
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      // tiebreak: critical then high
      return (b.counts.critical - a.counts.critical) || (b.counts.high - a.counts.high);
    });
  }

  function renderFleet() {
    sortHosts();
    var body = document.getElementById('fleet-body');
    if (!hosts.length) {
      body.innerHTML = '<tr><td colspan="7" style="color:var(--muted);padding:24px">No hosts have reported yet. Run submit.ps1 on an endpoint.</td></tr>';
    } else {
      body.innerHTML = hosts.map(function (h) {
        var c = h.counts;
        return '<tr data-host="' + esc(h.hostname) + '"' + (selected === h.hostname ? ' class="selected"' : '') + '>' +
          '<td class="host">' + esc(h.hostname) + '</td>' +
          '<td class="seen">' + esc(fmtTime(h.lastSeen)) + '</td>' +
          '<td>' + badge(c.critical, 'b-crit') + '</td>' +
          '<td>' + badge(c.high, 'b-high') + '</td>' +
          '<td>' + badge(c.medium, 'b-med') + '</td>' +
          '<td>' + badge(c.low, 'b-low') + '</td>' +
          '<td class="total">' + (c.total || 0) + '</td>' +
          '</tr>';
      }).join('');
      Array.prototype.forEach.call(body.querySelectorAll('tr'), function (tr) {
        tr.addEventListener('click', function () { showHost(tr.getAttribute('data-host')); });
      });
    }
    // summary
    var crit = 0, critHosts = 0;
    hosts.forEach(function (h) { crit += h.counts.critical; if (h.counts.critical > 0) critHosts++; });
    document.getElementById('s-hosts').textContent = hosts.length;
    document.getElementById('s-crithosts').textContent = critHosts;
    document.getElementById('s-crit').textContent = crit;
  }

  function showHost(name) {
    selected = name;
    renderFleet();
    var el = document.getElementById('detail');
    el.innerHTML = '<div class="empty">Loading…</div>';
    apiFetch('/api/host/' + encodeURIComponent(name)).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      var findings = d.findings || [];
      var order = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
      findings = findings.slice().sort(function (a, b) {
        return (order[(a.severity || '').toLowerCase()] ?? 9) - (order[(b.severity || '').toLowerCase()] ?? 9);
      });
      var html = '<h2>' + esc(d.hostname) + '</h2>' +
        '<div class="meta">Last seen ' + esc(fmtTime(d.lastSeen)) + ' · ' + findings.length + ' findings</div>';
      if (!findings.length) {
        html += '<div class="empty">No findings reported — clean.</div>';
      } else {
        html += findings.map(function (f) {
          var sev = (f.severity || 'info').toLowerCase();
          var hasConf = (f.confidence != null && f.confidence !== '');
          var conf = Math.max(0, Math.min(100, parseInt(f.confidence, 10) || 0));
          var action = String(f.recommended || '').toUpperCase();
          var hasPid = (f.pid != null && f.pid !== '' && String(f.pid) !== '0');
          var rows = '';
          rows += '<dt>Rule ID</dt><dd>' + esc(f.rule || '(unknown)') + '</dd>';
          rows += '<dt>Severity</dt><dd>' + esc(sev) + '</dd>';
          if (hasConf) {
            rows += '<dt>Confidence</dt><dd><span class="confbar"><i style="width:' + conf + '%"></i></span>' + conf + '%</dd>';
          }
          if (action) {
            rows += '<dt>Action</dt><dd><span class="pill act-' + esc(action.toLowerCase()) + '">' + esc(action) + '</span></dd>';
          }
          if (hasPid) rows += '<dt>PID</dt><dd>' + esc(f.pid) + '</dd>';
          if (f.target) rows += '<dt>Target</dt><dd>' + esc(f.target) + '</dd>';
          return '<div class="finding sev-' + esc(sev) + '">' +
            '<div class="row1">' +
              '<span class="sevtag sev-' + esc(sev) + '">' + esc(sev) + '</span>' +
              '<span class="rule">' + esc(f.rule || '(unknown)') + '</span>' +
              '<span class="chev">▸</span>' +
            '</div>' +
            (f.title ? '<div class="title">' + esc(f.title) + '</div>' : '') +
            (f.target ? '<div class="target">target: ' + esc(f.target) + (hasPid ? ' · pid ' + esc(f.pid) : '') + '</div>' : '') +
            (f.evidence ? '<div class="evidence">' + esc(f.evidence) + '</div>' : '') +
            '<div class="fdetail">' +
              '<dl class="fgrid">' + rows + '</dl>' +
              '<div class="fexplain">' +
                '<span class="lbl">What this means</span>' + esc(ruleFamily(f.rule)) +
                (action && ACTION_INFO[action] ? '<span class="lbl">Suggested response</span>' + esc(ACTION_INFO[action]) : '') +
              '</div>' +
            '</div>' +
            '</div>';
        }).join('');
      }
      el.innerHTML = html;
    }).catch(function (e) {
      el.innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + '</div>';
    });
  }

  function load() {
    apiFetch('/api/hosts').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      hosts = d || [];
      renderFleet();
      document.getElementById('refresh-note').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · auto-refresh 15s';
    }).catch(function (e) {
      document.getElementById('refresh-note').textContent = 'Error: ' + e.message;
    });
  }

  // header sorting
  Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'), function (th) {
    th.addEventListener('click', function () {
      var k = th.getAttribute('data-sort');
      if (sortKey === k) { sortDir = -sortDir; } else { sortKey = k; sortDir = (k === 'hostname' || k === 'lastSeen') ? 1 : -1; }
      renderFleet();
    });
  });

  // toggle a finding's drill-down when its header row is clicked (delegated,
  // so it keeps working after the panel re-renders).
  document.getElementById('detail').addEventListener('click', function (e) {
    var row = e.target.closest('.row1');
    if (!row) return;
    var card = row.closest('.finding');
    if (card) card.classList.toggle('open');
  });

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
